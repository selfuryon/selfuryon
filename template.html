<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$title$ — $headline$</title>
<meta name="description" content="$description$">
<meta name="author" content="$title$">
$if(noindex)$
<meta name="robots" content="noindex">
$endif$
<meta property="og:title" content="$title$ — $headline$">
<meta property="og:description" content="$description$">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e3a8a'/%3E%3Ctext x='16' y='21.5' font-family='monospace' font-size='14' font-weight='600' text-anchor='middle' fill='white'%3ESI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="${root}style.css">
</head>
<body>
<main class="resume">
<header>
  <div class="who">
    <h1>$title$</h1>
    <p class="headline">$headline$</p>
  </div>
$if(pdf)$
  <a class="download no-print" href="$pdf$" download>Download PDF</a>
$endif$
  <ul class="contacts">
$for(contacts)$
    <li>$contacts$</li>
$endfor$
  </ul>
</header>
$body$
$if(updated)$
<footer>Updated $updated$</footer>
$endif$
</main>
</body>
</html>
